<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МДЖ — Карта объектов</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f0f0f0;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0; left: 0;
    z-index: 1;
  }

  /* ── Пульсирующий маркер с цветом типа ── */
  .pulse-marker {
    position: relative;
    width: 16px;
    height: 16px;
  }

  .pulse-marker .core {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    position: absolute;
    top: 0; left: 0;
    z-index: 2;
  }

  .pulse-marker .ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid;
    animation: pulse-ring 2s ease-out infinite;
    z-index: 1;
  }

  @keyframes pulse-ring {
    0%   { width: 16px; height: 16px; opacity: 1; }
    100% { width: 50px; height: 50px; opacity: 0; }
  }

  /* ── Анимация появления маркера ── */
  .marker-enter {
    animation: marker-pop .4s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes marker-pop {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .marker-exit {
    animation: marker-fade .3s ease-out forwards;
  }

  @keyframes marker-fade {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* ── Кластеры с цветом типа ── */
  .marker-cluster-small,
  .marker-cluster-medium,
  .marker-cluster-large {
    background: rgba(0,0,0,.2) !important;
  }

  .marker-cluster-small div,
  .marker-cluster-medium div,
  .marker-cluster-large div {
    color: #fff !important;
    font-weight: 600;
    font-size: 13px;
  }

  /* ── Popup ── */
  .leaflet-popup-content-wrapper {
    background: #fff;
    color: #333;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.15);
    border: 1px solid rgba(0,0,0,.1);
  }

  .leaflet-popup-tip {
    background: #fff;
  }

  .leaflet-popup-close-button {
    color: #999 !important;
  }

  .popup-card {
    width: 260px;
    font-size: 13px;
    line-height: 1.5;
  }

  .popup-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #eee;
  }

  .popup-card .popup-type {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    color: #fff;
  }

  .popup-card .popup-address {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
  }

  /* ── Счётчик ── */
  .counter {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 1000;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(12px);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,.1);
    color: #333;
    font-size: 13px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
  }

  .counter strong {
    color: #ff6b00;
    font-size: 16px;
  }

  /* ── Логотип / бренд ── */
  .brand {
    position: absolute;
    bottom: 16px;
    left: 16px;
    z-index: 1000;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(12px);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,.1);
    color: #ff6b00;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .5px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
  }

  .brand span {
    color: #999;
    font-weight: 400;
    margin-left: 6px;
    font-size: 12px;
  }

  /* ── Leaflet overrides ── */
  .leaflet-control-zoom a {
    background: #fff !important;
    color: #333 !important;
    border-color: #ddd !important;
  }

  .leaflet-control-zoom a:hover {
    background: #ff6b00 !important;
    color: #fff !important;
  }

  /* Скрываем стандартную атрибуцию Leaflet */
  .leaflet-control-attribution {
    display: none !important;
  }

  /* ── Кастомная атрибуция без флага ── */
  .custom-attribution {
    position: absolute;
    bottom: 8px;
    right: 8px;
    z-index: 1000;
    background: rgba(255,255,255,.8);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    color: #666;
  }

  .custom-attribution a {
    color: #666;
    text-decoration: none;
  }

  .custom-attribution a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="counter">
  Объектов: <strong id="count">500</strong>
</div>

<div class="brand">МДЖ<span>Нижний Новгород</span></div>

<div class="custom-attribution">
  <a href="https://carto.com/" target="_blank">CARTO</a> | 
  <a href="https://www.openstreetmap.org/copyright" target="_blank">OSM</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function () {
  'use strict';

  // ── Типы объектов с цветами ──
  const objectTypes = {
    'Кухня': { 
      color: '#E8501A', 
      bg: 'rgba(232, 80, 26, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1556911220-bff31c812dba?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1556909114-44e3e70034e2?w=400&h=300&fit=crop'
      ]
    },
    'Прихожая': { 
      color: '#2196F3', 
      bg: 'rgba(33, 150, 243, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1595515106969-1ce29566ff1c?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=400&h=300&fit=crop'
      ]
    },
    'Ванная': { 
      color: '#00BCD4', 
      bg: 'rgba(0, 188, 212, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1584622050111-993a426fbf0a?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1631679706909-1844bbd07221?w=400&h=300&fit=crop'
      ]
    },
    'Туалет': { 
      color: '#9C27B0', 
      bg: 'rgba(156, 39, 176, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1620626012053-1c1e6f1c0c1e?w=400&h=300&fit=crop'
      ]
    },
    'Гардеробная': { 
      color: '#795548', 
      bg: 'rgba(121, 85, 72, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1596464716127-f2a82984de30?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1558997519-83ea9252edf8?w=400&h=300&fit=crop'
      ]
    },
    'Детская': { 
      color: '#FF9800', 
      bg: 'rgba(255, 152, 0, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1567016432779-094069958ea5?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1598928506311-c55ded91a20c?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1617806118233-18e1de247200?w=400&h=300&fit=crop'
      ]
    },
    'Подростковая': { 
      color: '#673AB7', 
      bg: 'rgba(103, 58, 183, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1617325247661-675ab4b64ae2?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1598928506311-c55ded91a20c?w=400&h=300&fit=crop'
      ]
    },
    'Встроенный шкаф': { 
      color: '#607D8B', 
      bg: 'rgba(96, 125, 139, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1595515106969-1ce29566ff1c?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=400&h=300&fit=crop'
      ]
    },
    'Комплексное решение': { 
      color: '#4CAF50', 
      bg: 'rgba(76, 175, 80, 0.25)',
      photos: [
        'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400&h=300&fit=crop',
        'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=400&h=300&fit=crop'
      ]
    }
  };

  const typeNames = Object.keys(objectTypes);

  // ── Улицы для генерации адресов ──
  const streets = [
    'ул. Большая Покровская', 'ул. Минина', 'ул. Горького', 'ул. Белинского',
    'ул. Ванеева', 'пр. Гагарина', 'ул. Родионова', 'Московское шоссе',
    'ул. Бекетова', 'ул. Рождественская', 'ул. Алексеевская', 'ул. Невзоровых',
    'ул. Полтавская', 'ул. Тимирязева', 'ул. Казанское шоссе', 'ул. Баумана',
    'ул. Краснодонцев', 'ул. Веденяпина', 'ул. Кузбасская', 'ул. Южное шоссе',
    'ул. Ильинская', 'ул. Ошарская', 'ул. Культуры', 'ул. Бринского',
    'ул. Берёзовская', 'ул. Куйбышева', 'ул. Комсомольская', 'ул. Ковалихинская',
    'ул. Студёная', 'ул. Генкиной', 'ул. Нестерова', 'ул. Грузинская',
    'ул. Ульянова', 'ул. Арзамасская', 'ул. Семашко', 'ул. Ларина',
    'ул. Провиантская', 'ул. Деловая', 'ул. Тропинина', 'ул. Козицкого',
    'ул. Героев Космоса', 'ул. Сахарова', 'ул. Пискунова', 'ул. Щербакова',
    'ул. Коминтерна', 'ул. Нартова', 'ул. Акимова', 'ул. Маршала Жукова',
    'ул. Черниговская', 'ул. Почаинская', 'ул. Варварская', 'ул. Строкина',
    'ул. Львовская', 'ул. Сусловой', 'ул. Мануфактурная', 'ул. Совнаркомовская',
    'ул. Федосеенко', 'ул. Патриотов', 'ул. Народная', 'ул. Лесной городок'
  ];

  // ── Генерация точек ──
  function seededRandom(seed) {
    var x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  var TOTAL = 500;
  var LAT_MIN = 56.200, LAT_MAX = 56.380;
  var LNG_MIN = 43.780, LNG_MAX = 44.080;

  var points = [];
  for (var i = 0; i < TOTAL; i++) {
    var lat = LAT_MIN + seededRandom(i * 7 + 1) * (LAT_MAX - LAT_MIN);
    var lng = LNG_MIN + seededRandom(i * 13 + 3) * (LNG_MAX - LNG_MIN);
    var street = streets[Math.floor(seededRandom(i * 17 + 5) * streets.length)];
    var house = Math.floor(seededRandom(i * 23 + 7) * 300) + 1;
    var typeName = typeNames[i % typeNames.length];
    var typeData = objectTypes[typeName];
    var photoIndex = Math.floor(seededRandom(i * 31 + 11) * 3);
    
    points.push({
      id: i,
      lat: Math.round(lat * 10000) / 10000,
      lng: Math.round(lng * 10000) / 10000,
      address: street + ', ' + house,
      type: typeName,
      color: typeData.color,
      bg: typeData.bg,
      photo: typeData.photos[photoIndex]
    });
  }

  // ── Инициализация карты ──
  const map = L.map('map', {
    center: [56.2900, 43.9300],
    zoom: 11,
    zoomControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  let isVisible = false;

  // ── Создание кластерной группы ──
  function createClusterGroup() {
    return L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 50,
      spiderfyOnMaxZoom: true,
      animateAddingMarkers: false,
      iconCreateFunction: function (cluster) {
        const count = cluster.getChildCount();
        let size = 'small';
        if (count > 10) size = 'large';
        else if (count > 5) size = 'medium';
        return L.divIcon({
          html: '<div>' + count + '</div>',
          className: 'marker-cluster marker-cluster-' + size,
          iconSize: L.point(40, 40)
        });
      }
    });
  }

  let clusterGroup = createClusterGroup();

  // ── Создание иконки пульсирующего маркера с цветом ──
  function createPulseIcon(color) {
    return L.divIcon({
      className: '',
      html: '<div class="pulse-marker"><div class="core" style="background:' + color + ';box-shadow:0 0 8px 2px ' + color + '80"></div><div class="ring" style="border-color:' + color + 'b3"></div></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      popupAnchor: [0, -12]
    });
  }

  // ── Создание popup-контента ──
  function createPopup(point) {
    return '<div class="popup-card">' +
      '<img src="' + point.photo + '" alt="' + point.type + '" loading="lazy" onerror="this.style.display=\'none\'">' +
      '<div class="popup-type" style="background:' + point.color + '">' + point.type + '</div>' +
      '<div class="popup-address">' + point.address + '</div>' +
    '</div>';
  }

  // ── Создание маркеров ──
  const markers = [];

  points.forEach(function (point) {
    const marker = L.marker([point.lat, point.lng], {
      icon: createPulseIcon(point.color)
    });
    marker.bindPopup(createPopup(point), { maxWidth: 280, offset: [0, -4] });
    marker._pointData = point;
    markers.push(marker);
  });

  // ── Отображение всех маркеров ──
  function showMarkers() {
    clusterGroup.clearLayers();
    
    markers.forEach(function (marker, i) {
      setTimeout(function () {
        clusterGroup.addLayer(marker);
        
        var el = marker.getElement && marker.getElement();
        if (el) {
          el.classList.remove('marker-enter');
          void el.offsetWidth;
          el.classList.add('marker-enter');
        }
      }, i * 5);
    });

    if (!map.hasLayer(clusterGroup)) {
      map.addLayer(clusterGroup);
    }
    
    isVisible = true;
  }

  // Автопоказ при загрузке
  setTimeout(function () {
    showMarkers();
  }, 300);

})();
</script>
</body>
</html>
